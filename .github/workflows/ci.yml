
name: RAG DevOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            karthik713/rag-devops-platform:latest
            karthik713/rag-devops-platform:${{ github.sha }}

  deploy-to-minikube:
    name: Deploy to Minikube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: self-hosted

    steps:
      - name: Verify Kubernetes access
        run: kubectl get nodes

      - name: Deploy image to Kubernetes
        run: kubectl set image deployment/rag-app rag-app=karthik713/rag-devops-platform:${{ github.sha }}

      - name: Verify deployment rollout
        run: kubectl rollout status deployment/rag-app --timeout=180s
